name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          shopt -s nullglob
          # -B: no __pycache__, which would otherwise show up in the diff check below.
          for test in drivers/*/test_*.py; do python3 -B "$test"; done
      - run: python3 scripts/generate-manifest.py
      - run: git diff --exit-code
